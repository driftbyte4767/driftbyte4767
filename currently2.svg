      .cmd { fill: #e6edf3; font-family: monospace; font-size: 13px; }
      .label { fill: #c9d1d9; font-family: monospace; font-size: 12px; }
      .score { fill: #8b949e; font-family: monospace; font-size: 11px; text-anchor: end; }
      .section { fill: #58a6ff; font-family: monospace; font-size: 12px; }
      .status { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .bar-bg { fill: #21262d; }
      .bar-high { fill: #58a6ff; }
      .bar-mid { fill: #8b949e; }
      .bar-low { fill: #3d444d; }
      .separator { stroke: #21262d; stroke-width: 1; }
      .cursor { fill: #e6edf3; animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
