<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .icon { fill: #58a6ff; font: 20px monospace; }
    .title { fill: #58a6ff; font: 600 18px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .desc { fill: #c9d1d9; font: 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .tech { fill: #8b949e; font: 12px monospace; }
    .dot { fill: #e34c26; }
  </style>
  <rect x="1" y="1" width="398" height="148" rx="8" class="bg"/>
  <text x="22" y="39" class="icon">&#9671;</text>
  <text x="54" y="39" class="title">Dark XP Linktree</text>
  <text x="22" y="70" class="desc">Responsive personal links page inspired by</text>
  <text x="22" y="90" class="desc">Windows XP and redesigned as a dark UI.</text>
  <circle cx="27" cy="122" r="5" class="dot"/>
  <text x="40" y="126" class="tech">HTML  /  CSS  /  JavaScript</text>
</svg>
